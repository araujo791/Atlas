name: NTLite mapping tests
on:
  push:
    paths:
      - 'scripts/import-ntlite-removals.py'
      - 'tests/test_ntlite_import.py'
      - 'config/ntlite-removals.json'
  pull_request:
    paths:
      - 'scripts/import-ntlite-removals.py'
      - 'tests/test_ntlite_import.py'
      - 'config/ntlite-removals.json'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
